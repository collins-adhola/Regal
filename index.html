<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="theme-color" content="#14395b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regal</title>
  </head>
  <body>
    <!-- Netlify form detection (hidden from users) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text"  name="fullName" />
      <input type="text"  name="companyName" />
      <input type="email" name="email" />
      <input type="tel"   name="telephone" />
      <select name="serviceRequired">
        <option value="cleaning">Cleaning &amp; Hygiene</option>
        <option value="maintenance">Maintenance &amp; Repairs</option>
        <option value="pest-control">Pest Control</option>
        <option value="property-care">Property Care</option>
        <option value="multiple">Multiple Services</option>
        <option value="other">Other</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
