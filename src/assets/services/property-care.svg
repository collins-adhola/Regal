<svg viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEE8E0"/>
      <stop offset="100%" stop-color="#D4C4B0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Background buildings (left) -->
  <rect x="60"  y="230" width="110" height="170" fill="white" fill-opacity="0.07"/>
  <polygon points="60,230 115,175 170,230"   fill="white" fill-opacity="0.06"/>
  <!-- Background buildings (right) -->
  <rect x="430" y="250" width="110" height="150" fill="white" fill-opacity="0.07"/>
  <polygon points="430,250 485,200 540,250"  fill="white" fill-opacity="0.06"/>
  <!-- Main building body -->
  <rect x="210" y="190" width="180" height="210" fill="white" fill-opacity="0.13"/>
  <!-- Roof -->
  <polygon points="195,190 300,100 405,190"   fill="white" fill-opacity="0.1"/>
  <!-- Windows — left column -->
  <rect x="230" y="218" width="48" height="48" rx="3" fill="white" fill-opacity="0.12"/>
  <rect x="230" y="284" width="48" height="48" rx="3" fill="white" fill-opacity="0.1"/>
  <!-- Windows — right column -->
  <rect x="322" y="218" width="48" height="48" rx="3" fill="white" fill-opacity="0.12"/>
  <rect x="322" y="284" width="48" height="48" rx="3" fill="white" fill-opacity="0.1"/>
  <!-- Door -->
  <rect x="272" y="340" width="56" height="60" rx="2" fill="white" fill-opacity="0.09"/>
</svg>
