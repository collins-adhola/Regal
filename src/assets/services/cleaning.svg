<svg viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DCF0F8"/>
      <stop offset="100%" stop-color="#A8CEDD"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Soft overlapping circles — soap bubble feel -->
  <circle cx="300" cy="200" r="160" fill="white" fill-opacity="0.09"/>
  <circle cx="160" cy="280" r="110" fill="white" fill-opacity="0.07"/>
  <circle cx="450" cy="130" r="130" fill="white" fill-opacity="0.08"/>
  <circle cx="520" cy="320" r="80"  fill="white" fill-opacity="0.06"/>
  <circle cx="80"  cy="120" r="90"  fill="white" fill-opacity="0.07"/>
  <!-- Fine ring accents -->
  <circle cx="300" cy="200" r="100" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.18"/>
  <circle cx="300" cy="200" r="55"  fill="none" stroke="white" stroke-width="1" stroke-opacity="0.14"/>
  <!-- Highlight dot cluster -->
  <circle cx="270" cy="178" r="3" fill="white" fill-opacity="0.5"/>
  <circle cx="310" cy="162" r="2" fill="white" fill-opacity="0.4"/>
  <circle cx="340" cy="190" r="2.5" fill="white" fill-opacity="0.35"/>
  <circle cx="255" cy="210" r="1.5" fill="white" fill-opacity="0.4"/>
</svg>
